---
- name: Initialize DB, Run Node.js Script, and Organize Files
  hosts: localhost
  collections:
    - community.general
  gather_facts: false
  vars:
    db_script: "../scripts/db.js"
    node_script: "../scripts/scanyclasifica.js"
    duplicate_script: "../scripts/deduplicate.js" 
    migracionadrive_script: "../scripts/migracionaldrive.js"
    input_dir: "../archivos"
    file_path: "../file_inventory.csv"
    log_file: "../pipeline.log"
    destination_dir: "../archivos_organizados"
    backup_dir: "/Users/devmike/nas_simulado"
    archive_patterns:
      - '*.log'
      - '*.mp4'
      - '*.jpg'
   

  tasks:
    - name: Run DB Initialization Script
      ansible.builtin.shell: |
        node {{ db_script }}
      args:
        chdir: "{{ playbook_dir }}"
      register: db_init_result

    - name: Log DB Initialization
      ansible.builtin.shell: |
        echo "DB Initialization script executed: $(date)" >> "{{ log_file }}"

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    - name: Find files to backup
      ansible.builtin.find:
        paths: "{{ input_dir }}"
        patterns: "{{ archive_patterns }}"
        recurse: yes
      register: files_to_backup

    - name: Copy files to simulated NAS
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ backup_dir }}/"
      loop: "{{ files_to_backup.files }}"

    - name: Log backup completion
      ansible.builtin.shell: |
        echo "Backup completed at $(date)" >> "{{ backup_dir }}/backup.log"

    - name: Check if file_inventory.csv exists

      ansible.builtin.stat:
        path: "{{ file_path }}"
      register: csv_stat

    - name: Run Node.js script to generate CSV
      ansible.builtin.shell: |
        node {{ node_script }} {{ input_dir }} {{ file_path }}
      args:
        chdir: "{{ playbook_dir }}"
      register: node_script_result
      when: not csv_stat.stat.exists | default(false)

    - name: Log Node.js script execution
      ansible.builtin.shell: |
        echo "Node.js script executed: $(date)" >> "{{ log_file }}"
      when: not csv_stat.stat.exists | default(false)

    - name: Log CSV missing warning
      ansible.builtin.shell: |
        echo "Warning: {{ file_path }} not found, skipping file organization: $(date)" >> "{{ log_file }}"
      when: not csv_stat.stat.exists | default(false) and (node_script_result.rc | default(1)) != 0

    - name: Log start of file organization
      ansible.builtin.shell: |
        echo "Starting file organization: $(date)" >> "{{ log_file }}"
      when: csv_stat.stat.exists | default(false) or (node_script_result.rc | default(1)) == 0

    - name: Read inventory CSV
      ansible.builtin.slurp:
        src: "{{ file_path }}"
      register: csv_content
      when: csv_stat.stat.exists | default(false) or (node_script_result.rc | default(1)) == 0

    - name: Parse CSV
      set_fact:
        files: "{{ (csv_content.content | b64decode | community.general.from_csv) }}"
      delegate_to: localhost
      when: csv_stat.stat.exists | default(false) or (node_script_result.rc | default(1)) == 0

    - name: Create target folders
      ansible.builtin.file:
        path: "{{ destination_dir }}/{{ item.client }}/{{ item.project }}/{{ 'Videos' if item.extension == '.mp4' else 'Designs' }}"
        state: directory
        mode: '0755'
      loop: "{{ (files | default([])) | unique(attribute='path') }}"
      when: item.extension in ['.mp4', '.jpg'] and files is defined

    - name: Move files to target folders
      ansible.builtin.command: >
        mv "{{ item.path }}" "{{ destination_dir }}/{{ item.client }}/{{ item.project }}/{{ 'Videos' if item.extension == '.mp4' else 'Designs' }}/"
      loop: "{{ files | default([]) }}"
      when: item.extension in ['.mp4', '.jpg'] and files is defined
      register: move_result
      ignore_errors: true

    - name: Log each file move
      ansible.builtin.shell: |
        echo "Moved {{ item.item.path }} to {{ destination_dir }}/{{ item.item.client }}/{{ item.item.project }}/{{ 'Videos' if item.item.extension == '.mp4' else 'Designs' }}" >> "{{ log_file }}"
      loop: "{{ move_result.results }}"
      when: item.rc == 0
      delegate_to: localhost

    - name: Run deduplication script
      ansible.builtin.shell: |
        node {{ duplicate_script }}
      args:
        chdir: "{{ playbook_dir }}"
      register: deduplication_result

    - name: Log deduplication result
      ansible.builtin.shell: |
        echo "Deduplication script executed: $(date)" >> "{{ log_file }}"
      delegate_to: localhost

    - name : Migrate files to Google Drive
      ansible.builtin.shell: |
        node {{ migracionadrive_script }} 
      args:
        chdir: "{{ playbook_dir }}"
      register: migracionadrive_result

    - name: Log completion
      ansible.builtin.shell: |
        echo "File organization completed: $(date)" >> "{{ log_file }}"
      when: csv_stat.stat.exists | default(false) or (node_script_result.rc | default(1)) == 0