---
- name: Migrate Files to Google Drive
  hosts: localhost
  gather_facts: false
  vars:
    migracionadrive_script: "../scripts/migracionadrive.js"
    file_path: "../file_inventory.csv"
    log_file: "../pipeline.log"

  tasks:
    - name: Check if file_inventory.csv exists
      ansible.builtin.stat:
        path: "{{ file_path }}"
      register: csv_stat

    - name: Log warning if CSV does not exist
      ansible.builtin.shell: |
        echo "Warning: {{ file_path }} not found, skipping migration: $(date)" >> "{{ log_file }}"
      when: not csv_stat.stat.exists | default(false)

    - name: Run migration script if CSV exists
      ansible.builtin.shell: |
        node {{ migracionadrive_script }} {{ file_path }}
      args:
        chdir: "{{ playbook_dir }}"
      register: migration_result
      when: csv_stat.stat.exists | default(false)
      failed_when: migration_result.rc != 0

    - name: Log migration execution
      ansible.builtin.shell: |
        echo "Migration script executed: $(date)" >> "{{ log_file }}"
      when: csv_stat.stat.exists | default(false)

    - name: Show migration output
      debug:
        var: migration_result.stdout
      when: csv_stat.stat.exists | default(false)