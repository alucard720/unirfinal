- name: Backup files to simulated NAS
  hosts: localhost
  collections:
    - community.general
  gather_facts: false
  become: false  # No need for sudo in local testing

  vars:
    workspace_dir: "{{ playbook_dir | dirname }}"
    destination_dir: "/Users/devmike/nas_simulado"
    base_dir: "{{ workspace_dir }}/archivos_organizados"
    archive_patterns:
      - '*.log'
      - '*.mp4'
      - '*.jpg'
    backup_dir: "{{ destination_dir }}"  # Local folder simulation

  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    - name: Find files to backup
      ansible.builtin.find:
        paths: "{{ base_dir }}"
        patterns: "{{ archive_patterns }}"
        recurse: yes
      register: files_to_backup

    - name: Copy files to simulated NAS
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ backup_dir }}/"
      loop: "{{ files_to_backup.files }}"

    - name: Log backup completion
      ansible.builtin.shell: |
        echo "Backup completed at $(date)" >> "{{ destination_dir }}/backup.log"
